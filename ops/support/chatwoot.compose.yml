# Chatwoot (community edition), the support inbox behind the admin help window.
#
# NOT a standalone stack. Merge these services and volumes into the central
# /srv/docker/docker-compose.yaml on the bltbox host, next to betterstats-*.
# Run everything from /srv/docker with COMPOSE_PROJECT_NAME=bltbox_docker_app
# (see ops/support/README.md and the platform guide). Never recreate
# betterstats-db: Chatwoot has its OWN Postgres below and shares nothing with it.
#
# Image tag is pinned to a community-edition release on purpose. Bump it by hand,
# read the release notes first, and take a backup of chatwoot-postgres before a
# major version.
#
# Upstream reference: https://github.com/chatwoot/chatwoot/blob/master/docker-compose.production.yaml
# The differences from upstream: no host port on postgres or redis, a pinned -ce
# tag, container names left to compose, and the rails service joins
# docker-shared-net so nginx-proxy-manager can reach it.

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:v4.19.1-ce
  env_file: /srv/docker/chatwoot.env
  volumes:
    - chatwoot_storage:/app/storage
  networks:
    - chatwoot-net

services:
  chatwoot-rails:
    <<: *chatwoot
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    networks:
      - chatwoot-net
      - docker-shared-net   # nginx-proxy-manager routes help.betterat.cricket to chatwoot-rails:3000
    restart: unless-stopped

  chatwoot-sidekiq:
    <<: *chatwoot
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: unless-stopped

  chatwoot-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:?set CHATWOOT_POSTGRES_PASSWORD in /srv/docker/.env}
    networks:
      - chatwoot-net

  chatwoot-redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    env_file: /srv/docker/chatwoot.env
    volumes:
      - chatwoot_redis_data:/data
    networks:
      - chatwoot-net

volumes:
  chatwoot_storage:
  chatwoot_postgres_data:
  chatwoot_redis_data:

networks:
  chatwoot-net:
    driver: bridge
  # Already defined in the central file. Listed here only so this snippet reads on
  # its own: do NOT add a second definition when merging.
  docker-shared-net:
    external: true
