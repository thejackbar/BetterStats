
# Detect ONLY social-media link-preview crawlers — NOT search-engine crawlers.
# Search engines (Googlebot, bingbot, etc.) execute JavaScript and want the
# real SPA. The /og-preview endpoint returns an empty <body>, so routing
# search bots through it would gut the indexable content.
map $http_user_agent $is_social_crawler {
    default                       0;
    ~*facebookexternalhit         1;
    ~*Facebot                     1;
    ~*Twitterbot                  1;
    ~*WhatsApp                    1;
    ~*LinkedInBot                 1;
    ~*TelegramBot                 1;
    ~*Discordbot                  1;
    ~*Slackbot                    1;
    ~*Pinterest                   1;
    ~*redditbot                   1;
    ~*Applebot                    1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Never cache index.html so browsers always get the latest JS bundle
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed JS/CSS assets can be cached aggressively (filenames change on rebuild)
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static SEO/AEO files
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location = /llms.txt {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }
    location = /llms-full.txt {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    # Dynamic sitemap is built by the backend (it needs DB access for clubs/players)
    location = /sitemap.xml {
        proxy_pass http://betterstats-backend:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "application/xml; charset=utf-8";
    }

    location / {
        # Social-media link-preview crawlers get server-rendered OG tags so
        # Facebook/Twitter/etc. show a useful card. Search engines fall
        # through to the SPA — Googlebot renders JS.
        if ($is_social_crawler) {
            rewrite ^(.*)$ /api/og-preview?path=$1 last;
        }
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://betterstats-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /images/ {
        proxy_pass http://betterstats-backend:8000/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /uploads/ {
        proxy_pass http://betterstats-backend:8000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /webhooks/ {
        proxy_pass http://betterstats-backend:8000/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
