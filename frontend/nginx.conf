map $http_user_agent $is_crawler {
    default                       0;
    ~*facebookexternalhit         1;
    ~*Facebot                     1;
    ~*Twitterbot                  1;
    ~*WhatsApp                    1;
    ~*LinkedInBot                 1;
    ~*TelegramBot                 1;
    ~*Discordbot                  1;
    ~*Applebot                    1;
    ~*Slackbot                    1;
    ~*Pinterest                   1;
    ~*redditbot                   1;
    ~*Googlebot                   1;
    ~*bingbot                     1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Never cache index.html so browsers always get the latest JS bundle
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed JS/CSS assets can be cached aggressively (filenames change on rebuild)
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # Social-media crawlers get server-rendered OG tags from the backend
        if ($is_crawler) {
            rewrite ^(.*)$ /api/og-preview?path=$1 last;
        }
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://betterstats-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /images/ {
        proxy_pass http://betterstats-backend:8000/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /uploads/ {
        proxy_pass http://betterstats-backend:8000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /webhooks/ {
        proxy_pass http://betterstats-backend:8000/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
