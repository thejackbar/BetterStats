
# Crawlers that should get the server-rendered page instead of the JS SPA:
#   - social link-preview bots (Facebook/Twitter/etc.) for OG cards
#   - AI answer-engine crawlers (GPTBot/ClaudeBot/PerplexityBot/etc.), which
#     mostly don't run JavaScript, so the bare SPA shell reads as empty to them
# Search engines (Googlebot, bingbot) are deliberately excluded: they execute
# JS and should index the real SPA. The /og-preview endpoint now returns a full
# answerable body (heading, 300+ words, question headings, links), not just OG
# tags, so it's safe and useful for AI crawlers.
map $http_user_agent $serve_prerender {
    default                       0;
    # Social / link-preview
    ~*facebookexternalhit         1;
    ~*Facebot                     1;
    ~*Twitterbot                  1;
    ~*WhatsApp                    1;
    ~*LinkedInBot                 1;
    ~*TelegramBot                 1;
    ~*Discordbot                  1;
    ~*Slackbot                    1;
    ~*Pinterest                   1;
    ~*redditbot                   1;
    ~*Applebot                    1;
    # AI answer-engine / training crawlers
    ~*GPTBot                      1;
    ~*OAI-SearchBot               1;
    ~*ChatGPT-User                1;
    ~*ClaudeBot                   1;
    ~*Claude-Web                  1;
    ~*anthropic-ai                1;
    ~*PerplexityBot               1;
    ~*Perplexity-User             1;
    ~*Amazonbot                   1;
    ~*Bytespider                  1;
    ~*CCBot                       1;
    ~*cohere-ai                   1;
    ~*Meta-ExternalAgent          1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Never cache index.html so browsers always get the latest JS bundle
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed JS/CSS assets can be cached aggressively (filenames change on rebuild)
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static image/media/font assets are always served straight from disk and
    # must never hit the crawler prerender rewrite in `location /`. Facebook and
    # the other link-preview bots fetch the og:image URL (e.g. /og-cover.png)
    # with THEIR crawler UA; if that fell through to `location /` it would be
    # rewritten to /api/og-preview and the bot would receive HTML, not the
    # image, and report "image wasn't downloaded". A regex location is matched
    # ahead of the `location /` prefix, so this takes precedence for assets.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot|mp4|webm|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Static SEO/AEO files
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location = /llms.txt {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }
    location = /llms-full.txt {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    # Branded vanity redirects for campaign links — keep the post/video copy
    # clean while the UTM tracking + ?cta=form still land on the real page.
    location ~ ^/trackyourmilestones/?$ {
        return 301 https://betterat.cricket/modules/betterstats?utm_source=metamilestonevideo&utm_medium=video&utm_campaign=milestones&cta=form;
    }

    # Dynamic sitemap is built by the backend (it needs DB access for clubs/players)
    location = /sitemap.xml {
        proxy_pass http://betterstats-backend:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "application/xml; charset=utf-8";
    }

    location / {
        # Social link-preview bots and AI answer-engine crawlers get the
        # server-rendered page (OG tags + a full answerable body). Search
        # engines fall through to the SPA — Googlebot renders JS.
        if ($serve_prerender) {
            rewrite ^(.*)$ /api/og-preview?path=$1 last;
        }
        try_files $uri $uri/ /index.html;
    }

    # Byte-serving for instructional videos, OFF unless deliberately switched
    # on. The backend serves video bytes itself by default; set
    # VIDEO_ACCEL_LOCATION=/_internal_videos/ on the backend to hand that job
    # to nginx here instead.
    #
    # WHY IT IS OPT-IN: nginx is the process that opens the file, so this only
    # works if the video directory is mounted into the FRONTEND container as
    # well as the backend. On the first deploy it was not, and every video
    # 404'd from nginx while the API reported file_present: true — invisible
    # until somebody pressed play. Serving from the backend needs one mount.
    #
    # Before switching it on, confirm the file is visible from BOTH:
    #   docker compose exec betterstats-backend  ls /mnt/media/bettercricket/internal/videos
    #   docker compose exec betterstats-frontend ls /mnt/media/bettercricket/internal/videos
    #
    # `internal` means a browser cannot request this path directly — only an
    # X-Accel-Redirect from the backend can reach it. The alias must match the
    # backend's video_storage_dir.
    location /_internal_videos/ {
        internal;
        alias /mnt/media/bettercricket/internal/videos/;
        add_header Cache-Control "public, max-age=3600";
    }

    # Video uploads for the Super Admin /videos library. A longer prefix wins
    # over `location /api/` below, so this is the block that handles them.
    #
    # The 20m cap on /api/ is right for every other endpoint (a logo, a CSV, a
    # scorecard photo) and far too small for a screen recording, so the cap is
    # raised HERE rather than globally — a bigger body limit on every endpoint
    # is a bigger surface than this one route needs.
    #
    # request_buffering off streams the upload straight through instead of
    # spooling a half-gigabyte file to nginx's disk first, and the timeouts are
    # generous because a large upload over a club's connection is slow, not
    # stuck.
    location /api/club-admin/super/videos {
        proxy_pass http://betterstats-backend:8000/club-admin/super/videos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # The scorecard import wizard. An EXACT match wins over every prefix
    # location, so these three blocks handle these three routes and nothing
    # else.
    #
    # A club bringing in a whole recovered history is a big sheet — the archive
    # that prompted this is 97 seasons, 7,915 matches and 184,661 rows, about
    # 24 MB — so the 20m cap on /api/ refuses it outright. Raised HERE rather
    # than globally, for the same reason the videos block above is: a bigger
    # body limit on every endpoint is a bigger surface than these routes need.
    #
    # EXACT (`location =`) rather than the prefix `.../games/import/`, and that
    # is not a style choice. nginx answers a request for `/games/import` with a
    # 301 to `/games/import/` whenever a trailing-slash prefix location with a
    # proxy_pass exists — and a 301 on a POST drops the body. That would break
    # the strict single-shot `POST /games/import` beside these, which works
    # today by falling through to /api/ and is deliberately left there: it has
    # no app-level size cap of its own, so raising nginx's would let an
    # unbounded body reach a route with no guard behind it. Measured, not
    # assumed — the prefix form was written first and 301'd.
    #
    # The preview cap MUST be kept in step with `_MAX_GAME_UPLOAD_BYTES` in
    # manual_entries.py. Raise one without the other and the raise is
    # invisible: nginx refuses the body before FastAPI is reached.
    location = /api/club-admin/manual-entries/games/import/preview {
        proxy_pass http://betterstats-backend:8000/club-admin/manual-entries/games/import/preview;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64m;
        # Streams the sheet straight through instead of spooling it to nginx's
        # own disk first, exactly as the video upload above does.
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Resolve and commit carry a TOKEN naming the sheet the preview staged, not
    # the rows, so their bodies are a few hundred bytes. The cap is raised
    # anyway, modestly, for a caller still posting rows directly — that is
    # supported, and those rows are about 4x the CSV as JSON because all 33
    # column names repeat on every row.
    #
    # The timeout is what these blocks are really for. MEASURED: writing 7,915
    # games and 182,154 rows takes 68s, past nginx's own 60s default — which
    # would hand the browser a 504 while the backend carried on and finished,
    # the "Gateway Time-out on a job that was working" shape this deployment
    # has already been bitten by once.
    location = /api/club-admin/manual-entries/games/import/resolve {
        proxy_pass http://betterstats-backend:8000/club-admin/manual-entries/games/import/resolve;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256m;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location = /api/club-admin/manual-entries/games/import/commit {
        proxy_pass http://betterstats-backend:8000/club-admin/manual-entries/games/import/commit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256m;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /api/ {
        proxy_pass http://betterstats-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;

        # While the backend is briefly unavailable (e.g. during a deploy),
        # serve a friendly JSON message instead of nginx's default
        # "Bad Gateway"/"Service Unavailable" page. The frontend parses this
        # `detail` and shows it to the user.
        #
        # Deliberately NO `proxy_intercept_errors on` — with it on, nginx also
        # intercepts 5xx responses the BACKEND itself deliberately returned and
        # replaces their real `detail` with the message below. The app uses 502
        # and 503 as meaningful statuses in ~46 places (an upstream Stripe /
        # Square / email failure, "Online billing isn't configured yet", …), so
        # every one of those read as "System refreshing" — which is how a
        # Stripe 400 on checkout looked like the site being down for a week.
        # Left off, error_page still covers the case it's actually for: an
        # unreachable or timed-out backend, where nginx generates the 502/504
        # itself. nginx.afl.conf has always been this way.
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"detail":"System refreshing. Please wait a moment…"}';
    }

    location /images/ {
        proxy_pass http://betterstats-backend:8000/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /uploads/ {
        proxy_pass http://betterstats-backend:8000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /webhooks/ {
        proxy_pass http://betterstats-backend:8000/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
