# bs-afl-frontend nginx config — the AFL silo's counterpart of nginx.conf.
# Deliberately lean: the AFL pass-1 app has no crawler prerender, sitemap or
# marketing routes yet (those come with later passes; port the relevant blocks
# from nginx.conf when they do). /api MUST point at bs-afl-backend — never a
# bare "backend" hostname, and never the cricket betterstats-backend (see the
# June 2026 crossed-proxy post-mortem in CLAUDE.md).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the shell — it names the content-hashed chunks.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed assets are immutable.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://bs-afl-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"detail": "System refreshing. Please wait a moment."}';
    }

    location /images/ {
        proxy_pass http://bs-afl-backend:8000/images/;
        proxy_set_header Host $host;
    }
}
