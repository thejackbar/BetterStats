# bs-afl-frontend nginx config — the AFL silo on the betterat.football
# umbrella domain (docs/afl-betterstats-plan.md, "domain topology").
#
# The app lives under the /afl/ path prefix: nginx-proxy-manager's single
# betterat.football entry forwards `location /afl` here with the prefix intact,
# so everything below is /afl-prefixed. The image is built with
# VITE_BASE=/afl/ + WEB_ROOT=/usr/share/nginx/html/afl so the bundle's own
# asset URLs and on-disk layout both match.
#
# /afl/api MUST point at bs-afl-backend — never a bare "backend" hostname, and
# never the cricket betterstats-backend (June 2026 crossed-proxy post-mortem).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Direct container hits on / (internal testing) — the public umbrella
    # landing page owns / via NPM, so this only helps a curl at the container.
    location = / {
        return 302 /afl/;
    }
    location = /afl {
        return 301 /afl/;
    }

    location /afl/api/ {
        proxy_pass http://bs-afl-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Was missing entirely here (present on cricket's nginx.conf as 20m) —
        # nginx's built-in 1m default was silently 413ing any real club
        # historical-stats spreadsheet upload well under the backend's own cap.
        client_max_body_size 50m;
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"detail": "System refreshing. Please wait a moment."}';
    }

    # Never cache the shell — it names the content-hashed chunks.
    location = /afl/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed assets are immutable.
    location ~* ^/afl/.+\.(?:js|css|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /afl/ {
        try_files $uri /afl/index.html;
    }
}
