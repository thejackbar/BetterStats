# bs-scout-frontend nginx config — BetterScout, served under the /betterscout
# path prefix on the existing betterat.cricket domain (see
# ops/scout/docker-compose.scout.yml for the full deployment shape).
#
# The app lives under /betterscout/: nginx-proxy-manager's existing
# betterat.cricket proxy host entry forwards a custom `location /betterscout`
# here with the prefix intact, so everything below is /betterscout-prefixed.
# The image is built with VITE_BASE=/betterscout/ + WEB_ROOT=/usr/share/nginx/html/betterscout
# so the bundle's own asset URLs and on-disk layout both match.
#
# /betterscout/api MUST point at bs-scout-backend — never a bare "backend"
# hostname, and never the cricket betterstats-backend (the exact class of
# mistake the June 2026 crossed-proxy post-mortem documents for the main app).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Direct container hits on / (internal testing) — the cricket app owns /
    # via NPM, so this only helps a curl at the container.
    location = / {
        return 302 /betterscout/;
    }
    location = /betterscout {
        return 301 /betterscout/;
    }

    location /betterscout/api/ {
        proxy_pass http://bs-scout-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Matches cricket's nginx.conf (20m) rather than nginx's 1m default —
        # AFL's own config note flags this was missing at first and silently
        # 413'd uploads well under the backend's own cap.
        client_max_body_size 20m;
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"detail": "System refreshing. Please wait a moment."}';
    }

    # Never cache the shell — it names the content-hashed chunks.
    location = /betterscout/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed assets are immutable.
    location ~* ^/betterscout/.+\.(?:js|css|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /betterscout/ {
        try_files $uri /betterscout/index.html;
    }
}
