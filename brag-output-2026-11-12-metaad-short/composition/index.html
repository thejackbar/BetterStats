<script>
const tl = gsap.timeline({ paused: true });
const $ = (s, p = document) => p.querySelector(s);
const mk = (parent, cls, html, style, tag = 'div') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (style) e.style.cssText = style; parent.appendChild(e); return e; };
// motion rules: ease-out entrances, exits ~20% shorter, no bounce on everyday UI, pops start at 0.95
const fi = (e, t, d = 0.45, y = 30) => tl.fromTo(e, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: 'power3.out', immediateRender: false }, t);
const fo = (e, t, d = 0.28) => tl.fromTo(e, { opacity: 1 }, { opacity: 0, duration: d, ease: 'sine.in', immediateRender: false }, t);
const pop = (e, t, d = 0.4) => tl.fromTo(e, { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: d, ease: 'power3.out', immediateRender: false }, t);
const stag = (els, t, gap = 0.04, d = 0.35, y = 16) => els.forEach((e, i) => fi(e, t + i * gap, d, y));
const press = (e, t) => tl.to(e, { scale: 0.97, duration: 0.1, ease: 'power2.out', yoyo: true, repeat: 1 }, t);
const pulse = (e, t) => tl.fromTo(e, { scale: 1 }, { scale: 1.05, duration: 0.18, ease: 'power2.out', yoyo: true, repeat: 1, immediateRender: false }, t);
const grow = (e, t, d = 0.9, ease = 'power2.out') => tl.fromTo(e, { scaleX: 0 }, { scaleX: 1, duration: d, ease, immediateRender: false }, t);
const typeIn = (parent, text, t0, dur, style) => { const w = mk(parent, 'ty', null, style, 'span'); [...text].forEach((c, i) => { const s = mk(w, '', c === ' ' ? '&nbsp;' : c, 'opacity:0', 'i'); tl.set(s, { opacity: 1 }, t0 + dur * i / text.length); }); return w; };
const count = (e, from, to, t0, d, fmt = (v) => Math.round(v).toLocaleString('en-AU')) => { const o = { v: from }; e.textContent = fmt(from); tl.fromTo(o, { v: from }, { v: to, duration: d, ease: 'power2.out', immediateRender: false, onUpdate: () => { e.textContent = fmt(o.v); } }, t0); };
const tap = (parent, x, y, t) => { const e = mk(parent, 'tap', null, `left:${x}px;top:${y}px`); tl.fromTo(e, { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.6, ease: 'power2.out', immediateRender: false }, t); };
const caps = (scene, A, list) => list.forEach(([text, a, b]) => { const c = mk(scene, 'cap', text); fi(c, A + a, 0.45, 24); fo(c, A + b - 0.25, 0.25); });
const sceneIO = (id, t0, t1, noIn) => { if (!noIn) tl.fromTo(id, { opacity: 0, filter: 'blur(10px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.35, ease: 'power2.out', immediateRender: false }, t0); else tl.set(id, { opacity: 1 }, 0); tl.fromTo(id, { opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(8px)', duration: 0.28, ease: 'sine.in', immediateRender: false }, t1 - 0.05); };
const crestTag = (scene, crest, label, t0, t1) => { const g = mk(scene, 'tag', `<img src="assets/crest/${crest}.png" alt="">${label}`); fi(g, t0, 0.35, 12); fo(g, t1 - 0.25, 0.25); return g; };
const FMT = (n) => n.toLocaleString('en-AU');
const CLUBS = { applecross: 'Applecross', bannockburn: 'Bannockburn', scarborough: 'Scarborough', gisborne: 'Gisborne' };
const searchBox = (S, top) => { const box = mk(S, 'abs', null, `left:90px;top:${top}px;width:900px;height:128px;border-radius:64px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5)`); mk(box, '', '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M16 16l5 5"/></svg>', 'position:absolute;left:44px;top:36px'); return box; };
const qline = (box) => mk(box, '', '', 'position:absolute;left:128px;top:34px;font:600 50px/60px Inter,sans-serif;color:#0a0d14;white-space:nowrap');

// background drift + logo
const drift = (id, pts) => { let t = 0, px = 0, py = 0, ps = 1; pts.forEach(([x, y, s, d]) => { tl.fromTo(id, { x: px, y: py, scale: ps }, { x, y, scale: s, duration: d, ease: 'sine.inOut', immediateRender: false }, t); t += d; px = x; py = y; ps = s; }); };

fo('#bug', 48.4, 0.4);

{ const S = $('#s1'), A = 0; sceneIO('#s1', 0, 7.6, true);
  const hl = mk(S, 'cap', 'Your club’s whole cricket history.<br><em>Kept for you.</em>', 'font-size:76px;opacity:0;top:350px');

  card(-7, 13, 650, (c) => { mk(c, 'mono', 'Most runs', 'left:22px;top:20px;font-size:22px;color:#16c784'); [['R. Wilton', '9,261', 1], ['A. Castley', '9,027', .97], ['D. Stirling', '8,115', .88], ['R. Pulley', '7,671', .8], ['M. Campbell', '7,450', .75]].forEach(([n, v, w], i) => { mk(c, '', n, `position:absolute;left:22px;top:${62 + i * 58}px;font:700 24px Inter,sans-serif`); mk(c, '', null, `position:absolute;left:22px;top:${96 + i * 58}px;width:${w * 200}px;height:10px;border-radius:5px;background:linear-gradient(90deg,#16c784,#12a46b)`); mk(c, '', v, `position:absolute;right:70px;top:${62 + i * 58}px;font:800 24px Inter,sans-serif;color:#16c784`); }); });
