# bs-football-landing nginx config. The page is hand-authored static HTML with
# no content-hashed assets, so nothing here is cached long — a rebuilt landing
# page shows immediately.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ @tolanding;
    }

    # An unknown path bounces to the landing instead of silently rendering it
    # at the wrong URL. Each code's app lives under its own prefix (/afl/...),
    # so e.g. /login is NOT an app URL — serving the landing there with a 200
    # reads as "the app is broken", and duplicates the page at every URL for
    # crawlers. The redirect makes the bounce visible in the address bar.
    location @tolanding {
        return 302 /;
    }
}
