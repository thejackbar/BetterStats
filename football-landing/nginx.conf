# bs-football-landing nginx config. The page is hand-authored static HTML with
# no content-hashed assets, so nothing here is cached long — a rebuilt landing
# page shows immediately.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
