<script>
const tl = gsap.timeline({ paused: true });
const $ = (s, p = document) => p.querySelector(s);
const mk = (parent, cls, html, style, tag = 'div') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (style) e.style.cssText = style; parent.appendChild(e); return e; };
const fi = (e, t, d = 0.45, y = 30, extra = {}) => tl.fromTo(e, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: 'power3.out', immediateRender: false, ...extra }, t);
const fo = (e, t, d = 0.35) => tl.fromTo(e, { opacity: 1 }, { opacity: 0, duration: d, ease: 'sine.in', immediateRender: false }, t);
const pop = (e, t, d = 0.5) => tl.fromTo(e, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: d, ease: 'back.out(1.8)', immediateRender: false }, t);
const grow = (e, t, d = 0.9, ease = 'power2.out') => tl.fromTo(e, { scaleX: 0 }, { scaleX: 1, duration: d, ease, immediateRender: false }, t);
const typeIn = (parent, text, t0, dur, style) => { const w = mk(parent, 'ty', null, style, 'span'); [...text].forEach((c, i) => { const s = mk(w, '', c === ' ' ? '&nbsp;' : c, 'opacity:0', 'i'); tl.set(s, { opacity: 1 }, t0 + dur * i / text.length); }); return w; };
const count = (e, from, to, t0, d, fmt = (v) => Math.round(v).toLocaleString('en-AU')) => { const o = { v: from }; e.textContent = fmt(from); tl.fromTo(o, { v: from }, { v: to, duration: d, ease: 'power1.out', immediateRender: false, onUpdate: () => { e.textContent = fmt(o.v); } }, t0); };

const caps = (scene, list, top) => list.forEach(([text, a, b]) => { const c = mk(scene, 'cap', text, top ? `top:${top}px` : ''); fi(c, a, 0.5, 26); fo(c, b - 0.3, 0.3); });

const crestTag = (scene, crest, label, t0, t1) => { const g = mk(scene, 'tag', `<img src="assets/crest/${crest}.png" alt="">${label}`); fi(g, t0, 0.4, 14); fo(g, t1 - 0.3, 0.3); return g; };

// ================= S1 hook (0 - 9)
{
  const S = $('#s1'); sceneIO('#s1', 0, 9.4);
  const h = mk(S, 'cap', 'Your club’s whole cricket history.<br><em>Kept for you.</em>', 'top:372px;font-size:70px;opacity:1');

  clubs.forEach(([name, key], i) => {
    const t = 0.5 + i * 0.86;
    const q = mk(box, '', '', 'position:absolute;left:128px;top:34px;font:600 50px/60px Inter,sans-serif;color:#0a0d14;opacity:0;white-space:nowrap');
    tl.set(q, { opacity: 1 }, t); tl.set(q, { opacity: 0 }, t + 0.84);
    typeIn(q, name, t, 0.42);
    const [cx, cy] = pos[i];
    const c = mk(S, 'crest h', null, `left:${cx - 95}px;top:${cy - 95}px;width:190px;height:190px`, 'img'); c.src = `assets/crest/${key}.png`;
    pop(c, t + 0.5, 0.45);
