<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Target</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111318;
    --fg: #e8e9ec;
    --muted: #8a8f98;
    --track: #262a33;
    --red: #e5484d;
    --amber: #f5a623;
    --green: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(8px, 3vw, 24px);
  }
  .card {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .gauge-wrap {
    position: relative;
    width: 100%;
  }
  svg { display: block; width: 100%; height: auto; }
  .track { fill: none; stroke: var(--track); stroke-linecap: round; }
  .fill { fill: none; stroke-linecap: round; transition: stroke-dasharray 0.6s ease, stroke 0.6s ease; }
  .center-text {
    position: absolute;
    left: 0; right: 0;
    top: 58%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .current {
    font-size: clamp(1.4rem, 8vw, 2.6rem);
    font-weight: 650;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .sub {
    margin-top: 6px;
    font-size: clamp(0.7rem, 2.6vw, 0.9rem);
    color: var(--muted);
  }
  .error {
    margin-top: 6px;
    font-size: 0.8rem;
    color: var(--red);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="gauge-wrap">
      <svg viewBox="0 0 200 120" preserveAspectRatio="xMidYMid meet">
        <path class="track" d="" stroke-width="14" id="track"></path>
        <path class="fill" d="" stroke-width="14" id="fill"></path>
      </svg>
      <div class="center-text">
        <div class="current" id="current">&nbsp;</div>
        <div class="sub" id="sub">Loading…</div>
      </div>
    </div>
  </div>

<script>
(function () {
  const CX = 100, CY = 100, R = 82;

  // Semicircle from 180deg (left) to 0deg (right), sweeping over the top.
  function arcPoint(angleDeg) {
    const rad = (Math.PI / 180) * angleDeg;
    return [CX + R * Math.cos(rad), CY - R * Math.sin(rad)];
  }

  function describeArc(startDeg, endDeg) {
    const [x1, y1] = arcPoint(startDeg);
    const [x2, y2] = arcPoint(endDeg);
    const largeArc = Math.abs(startDeg - endDeg) > 180 ? 1 : 0;
    // sweep=1 draws over the top (the arc bulging upward) for our decreasing-angle parameterisation
    return `M ${x1} ${y1} A ${R} ${R} 0 ${largeArc} 1 ${x2} ${y2}`;
  }

  const trackEl = document.getElementById("track");
  const fillEl = document.getElementById("fill");
  const currentEl = document.getElementById("current");
  const subEl = document.getElementById("sub");

  trackEl.setAttribute("d", describeArc(180, 0));

  function colourFor(pct) {
    if (pct < 33) return "var(--red)";
    if (pct < 66) return "var(--amber)";
    return "var(--green)";
  }

  function formatMoney(symbol, amount) {
    const rounded = Math.round(amount);
    return symbol + rounded.toLocaleString("en-AU");
  }

  function render(data) {
    const symbol = data.currencySymbol || "$";
    const current = Number(data.current) || 0;
    const target = Number(data.target) || 0;
    const pct = target > 0 ? (current / target) * 100 : 0;
    const clampedPct = Math.max(0, Math.min(100, pct));

    const endAngle = 180 - (clampedPct / 100) * 180;
    fillEl.setAttribute("d", describeArc(180, endAngle));
    fillEl.setAttribute("stroke", colourFor(pct));

    currentEl.textContent = formatMoney(symbol, current);
    subEl.textContent = `${pct.toFixed(1)}% of ${formatMoney(symbol, target)}`;
  }

  function targetOverride() {
    const params = new URLSearchParams(window.location.search);
    return params.get("target");
  }

  async function load() {
    try {
      // Relative (no leading slash) so this keeps working whether the app is
      // served at its own root or reverse-proxied under a path prefix like
      // /admin/gauge/ — resolves against the current directory-style URL either way.
      let url = "api/pipeline";
      const override = targetOverride();
      if (override) url += "?target=" + encodeURIComponent(override);
      const resp = await fetch(url, { cache: "no-store" });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const data = await resp.json();
      render(data);
    } catch (err) {
      subEl.textContent = "Couldn't load pipeline data";
      subEl.classList.add("error");
    }
  }

  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
