<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BetterSelect — cleaner selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<style>
  /* ── BetterStats "Press Box" tokens (dark, default) ─────────────────── */
  :root {
    --pb-accent:   #16c784;
    --pb-positive: #16c784;
    --pb-negative: #ef5b5b;
    --pb-red:      #ef5b5b;
    --pb-amber:    #f5b542;

    --pb-bg:        #0a0d14;
    --pb-surface:   #10141d;
    --pb-surface2:  #161b27;
    --pb-hairline:  #1d2331;
    --pb-hairline2: #262d3d;
    --pb-text:      #e6e8ef;
    --pb-dim:       #8a90a2;
    --pb-faint:     #5b6072;
    --pb-faintest:  #3a3f50;

    --font-display: 'Geist', 'Barlow Condensed', system-ui, sans-serif;
    --font-body:    'Geist', system-ui, sans-serif;
    --font-mono:    'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    color: var(--pb-text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Shared primitives used across the BetterSelect screens */
  .pb-card { background: var(--pb-surface); border: 1px solid var(--pb-hairline); border-radius: 10px; }
  .pb-card2 { background: var(--pb-surface2); border: 1px solid var(--pb-hairline); border-radius: 10px; }
  .pb-hair-b { border-bottom: 1px solid var(--pb-hairline); }
  .pb-hair-t { border-top: 1px solid var(--pb-hairline); }
  .mono { font-family: var(--font-mono); }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--pb-faint);
  }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* Tidy native scrollbars inside the dense panels */
  .bs-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .bs-scroll::-webkit-scrollbar-thumb { background: var(--pb-hairline2); border-radius: 8px; }
  .bs-scroll::-webkit-scrollbar-track { background: transparent; }

  /* Focus-mode overlay should let our artboards breathe on dark */
  .dc-focus-backdrop { background: rgba(4,6,11,0.86) !important; }

  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0a0d14" />
    <rect x="30" y="30" width="40" height="40" rx="8" fill="#16c784" opacity="0.15" />
    <path d="M40 50 l6 6 l14 -16" fill="none" stroke="#16c784" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="bs-data.jsx"></script>
<script type="text/babel" src="bs-shared.jsx"></script>
<script type="text/babel" src="bs-overview.jsx"></script>
<script type="text/babel" src="bs-availability.jsx"></script>
<script type="text/babel" src="bs-teams.jsx"></script>
<script type="text/babel" src="bs-ladders.jsx"></script>
<script type="text/babel" src="bs-selection-core.jsx"></script>
<script type="text/babel" src="bs-selection-c.jsx"></script>
<script type="text/babel" src="bs-players.jsx"></script>
<script type="text/babel" src="bs-app.jsx"></script>
</body>
</html>
