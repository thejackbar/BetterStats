<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BetterStats · Players — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ── Theme tokens (Press Box) — on :root so portals (modal) inherit them ─ */
  :root {
    --pb-accent:#16c784; --pb-positive:#16c784; --pb-amber:#f5b542; --pb-red:#ef5b5b;
    --display:'Geist',system-ui,sans-serif; --body:'Geist',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  }
  :root[data-theme="light"] {
    --pb-bg:#f5f6f8; --pb-surface:#ffffff; --pb-surface2:#eef0f3;
    --pb-hairline:#e1e4ea; --pb-hairline2:#d0d4dd;
    --pb-text:#1b1e27; --pb-dim:#5b6072; --pb-faint:#8a90a2; --pb-faintest:#b6bac6;
    --pb-shadow:0 1px 2px rgba(16,20,30,.04), 0 8px 24px -12px rgba(16,20,30,.10);
    --pb-railbg:#e7e9ee;
  }
  :root[data-theme="dark"] {
    --pb-bg:#0a0d14; --pb-surface:#10141d; --pb-surface2:#161b27;
    --pb-hairline:#1d2331; --pb-hairline2:#2a3344;
    --pb-text:#e6e8ef; --pb-dim:#8a90a2; --pb-faint:#69708a; --pb-faintest:#3a3f50;
    --pb-shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.6);
    --pb-railbg:#0d1119;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--pb-bg, #0a0d14); color: var(--pb-text); }
  #root { min-height: 100vh; }
  .bs-root { min-height: 100vh; background: var(--pb-bg); color: var(--pb-text);
    font-family: var(--body); -webkit-font-smoothing: antialiased; font-size: 14px; }
  input, button, select { font-family: var(--body); }
  ::selection { background: color-mix(in srgb, var(--pb-accent) 28%, transparent); }

  /* default thin scrollbar for sidebar/modal */
  .bs-scroll::-webkit-scrollbar { width: 9px; height: 9px; }
  .bs-scroll::-webkit-scrollbar-thumb { background: var(--pb-hairline2); border-radius: 8px; }
  .bs-scroll::-webkit-scrollbar-track { background: transparent; }

  /* ── Shell ────────────────────────────────────────────────────────────── */
  .pl-shell { display: flex; min-height: 100vh; }

  /* Sidebar */
  .pl-side { width: 244px; flex-shrink: 0; border-right: 1px solid var(--pb-hairline); background: var(--pb-surface);
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .pl-side-brand { padding: 18px 18px; border-bottom: 1px solid var(--pb-hairline); }
  .pl-logo { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 9px;
    background: var(--pb-accent); color: #06120c; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .02em; }
  .pl-side-nav { flex: 1; overflow-y: auto; padding: 10px 0 24px; }
  .pl-side-group { padding: 8px 0; }
  .pl-side-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--pb-faintest); padding: 6px 18px; }
  .pl-navitem { display: flex; align-items: center; padding: 8px 18px; font-size: 13.5px; color: var(--pb-faint); cursor: pointer; transition: all .14s; border-left: 2px solid transparent; }
  .pl-navitem:hover { color: var(--pb-text); background: var(--pb-surface2); }
  .pl-navitem.strong { color: var(--pb-dim); font-weight: 600; }
  .pl-navitem.active { color: var(--pb-accent); background: color-mix(in srgb, var(--pb-accent) 10%, transparent); border-left-color: var(--pb-accent); font-weight: 600; }

  /* Main column */
  .pl-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pl-topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 11px 22px;
    border-bottom: 1px solid var(--pb-hairline); background: color-mix(in srgb, var(--pb-surface) 85%, transparent); backdrop-filter: blur(10px); }
  .pl-burger { display: none; background: none; border: none; color: var(--pb-faint); cursor: pointer; padding: 4px; }
  .pl-club { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--pb-dim); padding: 7px 12px; border: 1px solid var(--pb-hairline2); border-radius: 9px; cursor: pointer; white-space: nowrap; }
  .pl-club span { max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  .pl-tb-btn { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--pb-dim); background: transparent; border: 1px solid var(--pb-hairline2); border-radius: 9px; padding: 7px 12px; cursor: pointer; }
  .pl-tb-btn:hover { color: var(--pb-text); }
  .pl-tb-icon { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 9px; background: var(--pb-surface2); border: 1px solid var(--pb-hairline); color: var(--pb-dim); cursor: pointer; }
  .pl-tb-icon:hover { color: var(--pb-text); }
  .pl-dot { position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--pb-accent); color: #06120c; font-family: var(--mono); font-size: 9.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .pl-user { font-size: 13.5px; color: var(--pb-dim); padding-left: 4px; }
  .pl-user b { color: var(--pb-accent); font-family: var(--mono); font-size: 11.5px; }

  .pl-content { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 26px 28px 32px; display: flex; flex-direction: column; min-height: 0; }

  .pl-pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .pl-h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: -.02em; }
  .pl-sub { margin-top: 4px; font-size: 13px; color: var(--pb-faint); font-variant-numeric: tabular-nums; }

  .pl-search { display: flex; align-items: center; gap: 11px; height: 50px; padding: 0 16px; border-radius: 12px;
    background: var(--pb-surface); border: 1px solid var(--pb-hairline2); margin-bottom: 14px; }
  .pl-search:focus-within { border-color: color-mix(in srgb, var(--pb-accent) 50%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pb-accent) 12%, transparent); }
  .pl-search input { flex: 1; background: none; border: none; outline: none; color: var(--pb-text); font-size: 15.5px; }
  .pl-search input::placeholder { color: var(--pb-faint); }
  .pl-clear { background: var(--pb-surface2); border: none; color: var(--pb-faint); width: 26px; height: 26px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .pl-clear:hover { color: var(--pb-text); }

  .pl-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .pl-ranges { display: inline-flex; gap: 4px; padding: 3px; background: var(--pb-surface); border: 1px solid var(--pb-hairline); border-radius: 10px; flex-wrap: wrap; }
  .pl-rangetab { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 7px; border: none; cursor: pointer;
    background: transparent; color: var(--pb-dim); font-family: var(--display); font-weight: 600; font-size: 13px; transition: all .14s; }
  .pl-rangetab:hover { color: var(--pb-text); }
  .pl-rangetab i { font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--pb-faintest); }
  .pl-rangetab.on { background: color-mix(in srgb, var(--pb-accent) 15%, transparent); color: var(--pb-accent); }
  .pl-rangetab.on i { color: color-mix(in srgb, var(--pb-accent) 80%, var(--pb-text)); }
  .pl-rangetab.empty { opacity: .4; }
  .pl-shown { margin-left: auto; font-size: 12px; color: var(--pb-faint); font-variant-numeric: tabular-nums; }

  /* List + jump rail */
  .pl-listwrap { display: flex; gap: 8px; align-items: stretch; flex: 1; min-height: 0; }
  .pl-scroll { position: relative; flex: 1; min-width: 0; overflow-y: auto; max-height: calc(100vh - 290px);
    background: var(--pb-surface); border: 1px solid var(--pb-hairline); border-radius: 14px; box-shadow: var(--pb-shadow); }

  /* prominent scrollbar — the requested fix */
  .pl-scroll.sb-prominent { scrollbar-width: auto; scrollbar-color: var(--pb-faint) var(--pb-railbg); }
  .pl-scroll.sb-prominent::-webkit-scrollbar { width: 15px; }
  .pl-scroll.sb-prominent::-webkit-scrollbar-track { background: var(--pb-railbg); border-radius: 0 14px 14px 0; }
  .pl-scroll.sb-prominent::-webkit-scrollbar-thumb { background: var(--pb-hairline2); border: 3px solid var(--pb-railbg); border-radius: 999px; min-height: 44px; }
  .pl-scroll.sb-prominent::-webkit-scrollbar-thumb:hover { background: var(--pb-faint); }
  .pl-scroll.sb-subtle { scrollbar-width: thin; }
  .pl-scroll.sb-subtle::-webkit-scrollbar { width: 9px; }
  .pl-scroll.sb-subtle::-webkit-scrollbar-thumb { background: var(--pb-hairline2); border-radius: 8px; }
  .pl-scroll.sb-subtle::-webkit-scrollbar-track { background: transparent; }

  .pl-letterhead { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 7px 18px;
    background: color-mix(in srgb, var(--pb-surface2) 92%, var(--pb-surface)); border-bottom: 1px solid var(--pb-hairline);
    backdrop-filter: blur(4px); font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .04em; color: var(--pb-accent); }
  .pl-letterhead i { font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--pb-faintest); }

  .pl-row { display: flex; align-items: center; gap: 14px; padding: 11px 18px; border-bottom: 1px solid var(--pb-hairline); cursor: pointer; transition: background .12s; }
  .pl-row:hover { background: var(--pb-surface2); }
  .pl-row.d-compact { padding: 7px 18px; gap: 12px; }
  .pl-row.d-comfy { padding: 15px 18px; gap: 16px; }
  .pl-row-main { flex: 1; min-width: 0; }
  .pl-row-top { display: flex; align-items: center; gap: 9px; flex-wrap: nowrap; min-width: 0; }
  .pl-row-name { font-family: var(--display); font-weight: 600; font-size: 15.5px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pl-row.d-comfy .pl-row-name { font-size: 16.5px; }
  .pl-row-meta { margin-top: 3px; font-size: 12.5px; color: var(--pb-faint); }
  .pl-badge { display: inline-flex; flex-shrink: 0; align-items: center; gap: 4px; font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .03em; padding: 2px 7px; border-radius: 999px; }
  .pl-badge.globe { background: color-mix(in srgb, var(--pb-amber) 14%, transparent); color: var(--pb-amber); }
  .pl-badge.mute { background: var(--pb-surface2); color: var(--pb-faint); border: 1px solid var(--pb-hairline2); }
  .pl-squad { font-family: var(--mono); font-size: 11px; color: var(--pb-faint); background: var(--pb-surface2); border: 1px solid var(--pb-hairline); padding: 4px 9px; border-radius: 7px; white-space: nowrap; flex-shrink: 0; }
  .pl-edit { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; font-family: var(--display); font-weight: 600; font-size: 12.5px; color: var(--pb-dim);
    background: transparent; border: 1px solid var(--pb-hairline2); border-radius: 8px; padding: 7px 12px; cursor: pointer; transition: all .14s; }
  .pl-row:hover .pl-edit { color: var(--pb-accent); border-color: color-mix(in srgb, var(--pb-accent) 45%, transparent); background: color-mix(in srgb, var(--pb-accent) 8%, transparent); }
  .pl-empty { padding: 48px 20px; text-align: center; color: var(--pb-faint); font-size: 14px; }

  /* A–Z jump rail */
  .pl-rail { display: flex; flex-direction: column; justify-content: center; gap: 0; padding: 6px 2px; width: 24px; flex-shrink: 0;
    background: var(--pb-surface); border: 1px solid var(--pb-hairline); border-radius: 999px; align-self: stretch; }
  .pl-rail-l { flex: 1; min-height: 0; border: none; background: none; cursor: pointer; padding: 0; border-radius: 999px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--pb-faint); transition: color .1s, background .1s; }
  .pl-rail-l:hover:not(.off) { color: var(--pb-text); }
  .pl-rail-l.here { color: var(--pb-accent); }
  .pl-rail-l.off { color: var(--pb-faintest); opacity: .45; cursor: default; }

  /* Scrim + responsive sidebar */
  .pl-scrim { display: none; }
  @media (max-width: 880px) {
    .pl-side { position: fixed; z-index: 60; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s; }
    .pl-side.open { transform: translateX(0); }
    .pl-scrim.show { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.5); }
    .pl-burger { display: inline-flex; }
    .pl-hide-sm { display: none !important; }
    .pl-content { padding: 20px 16px 24px; }
    .pl-scroll { max-height: calc(100vh - 320px); }
  }
  @media (max-width: 560px) {
    .pl-squad { display: none; }
    .pl-rail { display: none; }
    .pl-h1 { font-size: 25px; }
  }

  /* ── Player modal ─────────────────────────────────────────────────────── */
  .pm-scrim { position: fixed; inset: 0; z-index: 100; background: rgba(4,6,11,.62); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; padding: 24px; animation: pm-fade .16s ease both; }
  @keyframes pm-fade { from { opacity: 0; } to { opacity: 1; } }
  .pm-modal { width: min(1160px, 96vw); max-height: 92vh; overflow-y: auto; background: var(--pb-surface); color: var(--pb-text);
    border: 1px solid var(--pb-hairline2); border-radius: 18px; box-shadow: 0 40px 100px -30px rgba(0,0,0,.7); animation: pm-rise .2s ease both; }
  @keyframes pm-rise { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }
  .pm-head { position: sticky; top: 0; z-index: 4; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
    padding: 26px 30px; border-bottom: 1px solid var(--pb-hairline);
    background: linear-gradient(180deg, color-mix(in srgb, var(--pb-accent) 12%, var(--pb-surface)), var(--pb-surface)); }
  .pm-link { display: inline-block; margin-top: 8px; font-family: var(--mono); font-size: 12px; color: var(--pb-faint); text-decoration: none; }
  .pm-link:hover { color: var(--pb-accent); }
  .pm-nav { display: inline-flex; align-items: center; gap: 4px; background: var(--pb-surface2); border: 1px solid var(--pb-hairline); border-radius: 9px; padding: 3px; }
  .pm-nav button { width: 30px; height: 30px; border: none; background: none; color: var(--pb-dim); border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .pm-nav button:hover { color: var(--pb-text); background: var(--pb-surface); }
  .pm-nav span { font-family: var(--mono); font-size: 12px; color: var(--pb-dim); padding: 0 6px; white-space: nowrap; }
  .pm-nav span i { font-style: normal; color: var(--pb-faintest); }
  .pm-x { width: 38px; height: 38px; border: none; background: var(--pb-surface2); color: var(--pb-faint); border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .pm-x:hover { color: var(--pb-text); }
  .pm-body { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.05fr); }
  .pm-col { padding: 26px 30px; display: flex; flex-direction: column; gap: 22px; }
  .pm-snap { border-right: 1px solid var(--pb-hairline); }
  .pm-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--pb-faint); }
  .pm-formlab { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--pb-faint); }
  .pm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
  @media (max-width: 820px) {
    .pm-body { grid-template-columns: 1fr; }
    .pm-snap { border-right: none; border-bottom: 1px solid var(--pb-hairline); }
    .pm-head { flex-direction: column; }
  }

  .pl-loading { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #5b6072; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
</style>
</head>
<body>
<div class="bs-root" data-theme="dark">
  <div id="root"><div class="pl-loading">Loading players…</div></div>
</div>

<template id="__bundler_thumbnail">

    <path d="M26 62a12 12 0 0 1 24 0" fill="none" stroke="#16c784" stroke-width="3"/>
    <path d="M62 34h12M62 46h12M62 58h8" stroke="#16c784" stroke-width="3" stroke-linecap="round"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="players/data.js"></script>
<script type="text/babel" src="players/ui.jsx"></script>
<script type="text/babel" src="players/tweaks-panel.jsx"></script>

<script type="text/babel" src="players/app.jsx"></script>
