<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="'Barlow Condensed','Geist',Arial,sans-serif">
  <defs>
    <linearGradient id="bcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16c784"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#16c784" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1920" fill="#0a0d14"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>

  <!-- top safe area for Stories UI ~250px -->
  <text x="540" y="330" text-anchor="middle" font-family="'Geist',Arial,sans-serif" font-size="34" font-weight="700" fill="#e6e8ef">Better<tspan fill="#16c784">Cricket</tspan></text>

  <!-- headline -->
  <text x="540" y="470" text-anchor="middle" font-size="100" font-weight="700" letter-spacing="-2" fill="#e6e8ef">YOUR CRICKET</text>
  <text x="540" y="572" text-anchor="middle" font-size="100" font-weight="700" letter-spacing="-2" fill="url(#bcGrad)">CAREER,</text>
  <text x="540" y="674" text-anchor="middle" font-size="100" font-weight="700" letter-spacing="-2" fill="#e6e8ef">ON ONE PAGE.</text>

  <!-- share stat card -->
  <g transform="translate(140,760)">
    <rect width="800" height="760" rx="34" fill="#10141d" stroke="#1d2331"/>
    <rect x="0" y="0" width="800" height="14" rx="7" fill="url(#bcGrad)"/>
    <circle cx="120" cy="150" r="76" fill="#161b27" stroke="#16c784" stroke-width="3"/>
    <text x="120" y="172" text-anchor="middle" font-family="'Geist',Arial,sans-serif" font-size="60" font-weight="700" fill="#16c784">JB</text>
    <text x="230" y="130" font-family="'Geist',Arial,sans-serif" font-size="46" font-weight="700" fill="#e6e8ef">J. Barendse</text>
    <text x="230" y="180" font-family="'Geist',Arial,sans-serif" font-size="28" fill="#8a90a2">All-rounder &#183; 14 seasons</text>
    <line x1="48" y1="270" x2="752" y2="270" stroke="#1d2331"/>
    <g font-family="'Geist',Arial,sans-serif">
      <text x="48"  y="400" font-size="84" font-weight="700" fill="#16c784">4,196</text>
      <text x="48"  y="446" font-size="28" fill="#8a90a2">Career runs</text>
      <text x="430" y="400" font-size="84" font-weight="700" fill="#3b82f6">168</text>
      <text x="430" y="446" font-size="28" fill="#8a90a2">Wickets</text>
      <text x="48"  y="592" font-size="84" font-weight="700" fill="#f5b542">93</text>
      <text x="48"  y="638" font-size="28" fill="#8a90a2">Catches</text>
      <text x="430" y="592" font-size="84" font-weight="700" fill="#a855f7">7</text>
      <text x="430" y="638" font-size="28" fill="#8a90a2">Player of match</text>
    </g>
    <text x="48" y="710" font-family="'Geist',Arial,sans-serif" font-size="24" fill="#5b6072">Shareable stat card &#183; betterat.cricket</text>
  </g>

  <!-- CTA -->
  <g transform="translate(140,1580)">
    <rect width="800" height="120" rx="60" fill="url(#bcGrad)"/>
    <text x="400" y="74" text-anchor="middle" font-family="'Geist',Arial,sans-serif" font-size="38" font-weight="700" fill="#06231a">Get your club on it &#8594;</text>
  </g>
  <text x="540" y="1770" text-anchor="middle" font-family="'Geist',Arial,sans-serif" font-size="28" fill="#8a90a2">Follow for stat cards, records &amp; club features</text>
</svg>
