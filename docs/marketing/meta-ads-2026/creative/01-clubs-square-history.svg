<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="'Barlow Condensed','Geist',Arial,sans-serif">
  <defs>
    <linearGradient id="bcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16c784"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#16c784" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1080" height="1080" fill="#0a0d14"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- brand wordmark -->
  <text x="80" y="120" font-family="'Geist',Arial,sans-serif" font-size="34" font-weight="700" fill="#e6e8ef">Better<tspan fill="#16c784">Cricket</tspan></text>

  <!-- pill -->
  <rect x="80" y="160" width="360" height="50" rx="25" fill="#10141d" stroke="#1d2331"/>
  <circle cx="108" cy="185" r="6" fill="#16c784"/>
  <text x="128" y="193" font-family="'Geist',Arial,sans-serif" font-size="22" fill="#8a90a2">Built by club cricketers</text>

  <!-- headline -->
  <text x="78" y="350" font-size="118" font-weight="700" letter-spacing="-2" fill="#e6e8ef">YOUR CLUB'S</text>
  <text x="78" y="460" font-size="118" font-weight="700" letter-spacing="-2" fill="#e6e8ef">WHOLE HISTORY,</text>
  <text x="78" y="570" font-size="118" font-weight="700" letter-spacing="-2" fill="url(#bcGrad)">ONLINE.</text>

  <!-- faux stat card -->
  <g transform="translate(80,640)">
    <rect width="920" height="250" rx="22" fill="#10141d" stroke="#1d2331"/>
    <text x="36" y="64" font-family="'Geist',Arial,sans-serif" font-size="26" font-weight="600" fill="#e6e8ef">Career, all-time</text>
    <text x="36" y="98" font-family="'Geist',Arial,sans-serif" font-size="20" fill="#5b6072">Imported automatically, back to 1975 for some clubs</text>
    <line x1="36" y1="120" x2="884" y2="120" stroke="#1d2331"/>
    <g font-family="'Geist',Arial,sans-serif">
      <text x="36"  y="186" font-size="60" font-weight="700" fill="#16c784">8,412</text>
      <text x="36"  y="222" font-size="22" fill="#8a90a2">Runs</text>
      <text x="276" y="186" font-size="60" font-weight="700" fill="#3b82f6">317</text>
      <text x="276" y="222" font-size="22" fill="#8a90a2">Wickets</text>
      <text x="516" y="186" font-size="60" font-weight="700" fill="#f5b542">204</text>
      <text x="516" y="222" font-size="22" fill="#8a90a2">Matches</text>
      <text x="756" y="186" font-size="60" font-weight="700" fill="#a855f7">52</text>
      <text x="756" y="222" font-size="22" fill="#8a90a2">Seasons</text>
    </g>
  </g>

  <!-- CTA bar -->
  <g transform="translate(80,940)">
    <rect width="920" height="74" rx="37" fill="url(#bcGrad)"/>
    <text x="40" y="48" font-family="'Geist',Arial,sans-serif" font-size="30" font-weight="700" fill="#06231a">Free demo on your club's data</text>
    <text x="880" y="48" text-anchor="end" font-family="'Geist',Arial,sans-serif" font-size="30" font-weight="700" fill="#06231a">betterat.cricket  &#8594;</text>
  </g>
</svg>
