<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="'Barlow Condensed','Geist',Arial,sans-serif">
  <defs>
    <linearGradient id="bcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16c784"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#16c784" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1350" fill="#0a0d14"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>

  <text x="80" y="120" font-family="'Geist',Arial,sans-serif" font-size="34" font-weight="700" fill="#e6e8ef">Better<tspan fill="#16c784">Cricket</tspan></text>

  <!-- headline -->
  <text x="78" y="280" font-size="96" font-weight="700" letter-spacing="-2" fill="#e6e8ef">FIVE TOOLS</text>
  <text x="78" y="372" font-size="96" font-weight="700" letter-spacing="-2" fill="#e6e8ef">WORTH OF CLUB</text>
  <text x="78" y="464" font-size="96" font-weight="700" letter-spacing="-2" fill="#e6e8ef">ADMIN.</text>
  <text x="78" y="556" font-size="96" font-weight="700" letter-spacing="-2" fill="url(#bcGrad)">ONE PLATFORM.</text>

  <!-- replaces list -->
  <g font-family="'Geist',Arial,sans-serif" transform="translate(80,640)">
    <text x="0" y="40" font-size="24" fill="#5b6072">Replaces the usual patchwork</text>
    <g font-size="28" fill="#e6e8ef" font-weight="600">
      <g transform="translate(0,80)">
        <rect x="0" y="-34" width="430" height="64" rx="14" fill="#10141d" stroke="#1d2331"/>
        <text x="22" y="8">Spreadsheets</text>
        <rect x="460" y="-34" width="440" height="64" rx="14" fill="#10141d" stroke="#1d2331"/>
        <text x="482" y="8">Website builder</text>
      </g>
      <g transform="translate(0,164)">
        <rect x="0" y="-34" width="280" height="64" rx="14" fill="#10141d" stroke="#1d2331"/>
        <text x="22" y="8">Canva</text>
        <rect x="310" y="-34" width="300" height="64" rx="14" fill="#10141d" stroke="#1d2331"/>
        <text x="332" y="8">Mailchimp</text>
        <rect x="640" y="-34" width="260" height="64" rx="14" fill="#10141d" stroke="#1d2331"/>
        <text x="662" y="8">Group chats</text>
      </g>
    </g>
  </g>

  <!-- price line -->
  <g font-family="'Geist',Arial,sans-serif" transform="translate(80,950)">
    <text x="0" y="40" font-size="40" font-weight="700" fill="#e6e8ef">From <tspan fill="#16c784">$399</tspan>/year.</text>
    <text x="0" y="92" font-size="30" fill="#8a90a2">Your full history imported at no extra cost.</text>
  </g>

  <!-- CTA -->
  <g transform="translate(80,1130)">
    <rect width="920" height="140" rx="28" fill="#10141d" stroke="#1d2331"/>
    <rect x="36" y="36" width="500" height="68" rx="34" fill="url(#bcGrad)"/>
    <text x="286" y="80" text-anchor="middle" font-family="'Geist',Arial,sans-serif" font-size="30" font-weight="700" fill="#06231a">Book a demo &#8594;</text>
    <text x="572" y="68" font-family="'Geist',Arial,sans-serif" font-size="28" font-weight="600" fill="#e6e8ef">betterat.cricket</text>
    <text x="572" y="104" font-family="'Geist',Arial,sans-serif" font-size="22" fill="#5b6072">Built on your real players</text>
  </g>
</svg>
