services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: betterstats
      POSTGRES_USER: cricket
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricket -d betterstats"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://cricket:${DB_PASSWORD}@db/betterstats
      SYNC_DATABASE_URL: postgresql://cricket:${DB_PASSWORD}@db/betterstats
      SECRET_KEY: ${SECRET_KEY}
      PLAYHQ_BASE_URL: https://grassrootsapiproxy.cricket.com.au
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3002}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3002:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
