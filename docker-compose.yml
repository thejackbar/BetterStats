services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: betterstats
      POSTGRES_USER: cricket
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricket -d betterstats"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://cricket:${DB_PASSWORD}@db/betterstats
      SYNC_DATABASE_URL: postgresql://cricket:${DB_PASSWORD}@db/betterstats
      SECRET_KEY: ${SECRET_KEY}
      PLAYHQ_BASE_URL: https://grassrootsapiproxy.cricket.com.au
      PLAYHQ_API_KEY: ${PLAYHQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3002}
      # KlubPro migration tooling — empty unless an operator is onboarding clubs.
      # On the box, ensure this backend shares a Docker network with klubpro-postgres.
      KLUBPRO_DATABASE_URL: ${KLUBPRO_DATABASE_URL:-}
    volumes:
      - uploads:/app/uploads
      # Instructional video files. A bind mount to an explicit host path, NOT a
      # named volume: a named volume can be orphaned by a compose project
      # rename, which is what caused the June 2026 outage. Deliberately outside
      # the regular backup — see ops/backup/backup.sh and config/settings.py.
      - ${VIDEO_STORAGE_DIR:-/mnt/media/bettercricket/internal/videos}:/mnt/media/bettercricket/internal/videos
      # The rendered club teaser pictures (emails, share cards, ads). Same
      # reasoning as the videos above, and the same exclusion from the backup:
      # every file can be re-drawn from its snapshot. The backend writes them
      # and serves them itself, so the frontend container does not need this.
      - ${TEASER_IMAGE_DIR:-/mnt/media/bettercricket/internal/teasers}:/mnt/media/bettercricket/internal/teasers
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    volumes:
      # nginx serves the video bytes itself via X-Accel-Redirect, so it needs
      # the same directory the backend writes to. Read-only: the frontend only
      # ever serves these, it never writes one.
      - ${VIDEO_STORAGE_DIR:-/mnt/media/bettercricket/internal/videos}:/mnt/media/bettercricket/internal/videos:ro
    ports:
      - "3002:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
